name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checar:
    runs-on: ubuntu-latest
    # Postgres descartável do próprio runner, só com dados fictícios. Nenhum segredo neste workflow.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: passaly
          POSTGRES_PASSWORD: passaly
          POSTGRES_DB: passaly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U passaly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://passaly:passaly@localhost:5432/passaly_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ADR 0013: nada de terceiro no navegador. `git grep` sai com 1 quando não acha; erro (2+) também falha.
      - name: Barrar recurso remoto em CSS e TSX
        run: |
          status=0
          git grep -niE "url\([[:space:]]*[\"']?(https?:)?//|@import[[:space:]]*(url\(|[\"'](https?:)?//)" -- '*.css' '*.tsx' || status=$?
          test "$status" -eq 1
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # #7: o SMS falso não existe em produção.
      - name: Conferir que o SMS falso ficou fora do build
        run: test -z "$(find dist/server -name 'sms-falso*' -o -path '*/dev/*')"
