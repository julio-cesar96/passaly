name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checar:
    runs-on: ubuntu-latest
    # Postgres descartável do próprio runner, só com dados fictícios. Nenhum segredo neste workflow.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: passaly
          POSTGRES_PASSWORD: passaly
          POSTGRES_DB: passaly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U passaly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://passaly:passaly@localhost:5432/passaly_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
